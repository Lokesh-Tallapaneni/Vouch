<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vouch{% endblock %}</title>
  <meta name="description"
        content="Vouch — find your way in through the people who already know the way.">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/vouch.css">
  {# htmx injects its own <style> for .htmx-indicator on load. Our CSP is
     `style-src 'self'` with no `unsafe-inline`, so the browser blocks it
     and logs a violation on every page. vouch.css defines those rules
     itself, so the injected copy is redundant -- switching it off removes
     a console error a reviewer would otherwise see, rather than weakening
     the policy to accommodate it. Configured by meta tag because that is
     htmx's own CSP-safe mechanism: an inline <script> would be blocked too. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  {# Vendored, not CDN-linked: a CDN in the CSP is a trust dependency bought
     for nothing, and vendoring means the demo works offline. The integrity
     hash stays as tamper-evidence even though the file is same-origin --
     it pins the exact htmx 2.0.4 build this app was tested against, so a
     future edit to the vendored file (accidental or not) fails loudly
     instead of silently changing behaviour. Recompute after any upgrade:
       python -c "import hashlib,base64,pathlib; print('sha384-'+base64.b64encode(
         hashlib.sha384(pathlib.Path('app/static/js/htmx.min.js').read_bytes())
         .digest()).decode())" #}
  <script src="/static/js/htmx.min.js"
          integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
          defer></script>
  {# First-party, not vendored -- no integrity hash: unlike htmx.min.js this
     file is ours, edited in place as the app changes, and same-origin
     already is the trust boundary CSP's script-src 'self' enforces. Wires
     every htmx write request (starting with sign-out in _header.html) with
     the CSRF header CSRFMiddleware requires -- see the file itself. #}
  <script src="/static/js/csrf.js" defer></script>
  {# Same reasoning as csrf.js above: first-party, no integrity hash. Wires
     the "Copy" button under a route's intro-message disclosure
     (_intro_disclosure.html) -- navigator.clipboard needs no CSP
     exception, but the click handler itself must live in this file, not
     an inline attribute, for the same script-src 'self' reason. #}
  <script src="/static/js/copy-intro.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include "_header.html" %}
  <main id="main" class="site-main" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Vouch — a referral-path finder over a synthetic professional network.</p>
  </footer>
</body>
</html>
