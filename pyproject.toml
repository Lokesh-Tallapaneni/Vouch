[project]
name = "vouch"
version = "0.1.0"
description = "Vouch — a referral-path finder over a professional network, backed by CognoDB."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Own ASGI framework. NOTE: the PyPI name is `veloceframework`; the name
    # `veloce` belongs to an unrelated Ray/PyTorch library.
    "veloceframework==0.12.1",
    # Official Neo4j driver — CognoDB speaks openCypher over Bolt 5.x.
    "neo4j>=5.28,<6",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live CognoDB instance (COGNODB_URI set)",
]
